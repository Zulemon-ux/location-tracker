<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Lokasi</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101114;
            color: white;
        }

        header {
            padding: 18px;
            background: #1b1d22;
        }

        h2 {
            margin: 0;
        }

        #info {
            padding: 15px;
            background: #181a1f;
            line-height: 1.7;
        }

        #map {
            width: 100%;
            height: calc(100vh - 150px);
        }
    </style>
</head>

<body>

<header>
    <h2>📍 Dashboard Lokasi</h2>
</header>

<div id="info">
    Menunggu data lokasi...
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const SUPABASE_URL = "https://vuzhoebhvjwnmehxlcfw.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1emhvZWJodmp3bm1laHhsY2Z3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyOTYzMDQsImV4cCI6MjEwNDg3MjMwNH0.PcDX8xMvyf6gqT3Le1oQdbQJpKPy3kMS-3W8tKDbkk8";

const params = new URLSearchParams(window.location.search);

const sessionId =
    params.get("id") || "default";


const map = L.map("map").setView(
    [-7.25, 112.75],
    13
);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);


let marker = null;


async function loadLocation() {

    try {

        const url =
            SUPABASE_URL +
            "/rest/v1/locations" +
            "?session_id=eq." +
            encodeURIComponent(sessionId) +
            "&order=created_at.desc" +
            "&limit=1";


        const response = await fetch(url, {

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization":
                    "Bearer " + SUPABASE_KEY
            }

        });


        if (!response.ok) {
            throw new Error("Gagal mengambil data");
        }


        const data = await response.json();


        if (data.length === 0) {

            document.getElementById("info").innerHTML =
                "Belum ada lokasi untuk sesi ini.";

            return;
        }


        const location = data[0];

        const lat = location.latitude;
        const lng = location.longitude;


        if (marker) {
            marker.remove();
        }


        marker = L.marker([lat, lng])
            .addTo(map)
            .bindPopup("Lokasi yang dibagikan")
            .openPopup();


        map.setView(
            [lat, lng],
            16
        );


        document.getElementById("info").innerHTML = `
            Latitude: ${lat}<br>
            Longitude: ${lng}<br>
            Akurasi: ±${Math.round(location.accuracy)} meter<br>
            Update: ${new Date(location.created_at).toLocaleString("id-ID")}
        `;


    } catch (error) {

        console.error(error);

        document.getElementById("info").textContent =
            "Gagal mengambil data lokasi.";
    }
}


loadLocation();

setInterval(loadLocation, 5000);

</script>

</body>
</html>
