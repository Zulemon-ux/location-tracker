<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bagikan Lokasi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #101114;
            color: white;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            background: #1b1d22;
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #aaa;
            line-height: 1.6;
        }

        button {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 12px;
            background: #4f7cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>VERIFIKASI KEHADIRAN</h1>

    <p>
        Untuk melanjutkan, izinkan akses lokasi
agar posisi check-in dapat dicatat.
    </p>

    <button id="locationBtn" onclick="shareLocation()">
        Mulai Check-in
    </button>

    <div id="status">
        Belum Check-in kehadiran
    </div>

</div>

<script>

const SUPABASE_URL = "https://vuzhoebhvjwnmehxlcfw.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1emhvZWJodmp3bm1laHhsY2Z3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyOTYzMDQsImV4cCI6MjEwNDg3MjMwNH0.PcDX8xMvyf6gqT3Le1oQdbQJpKPy3kMS-3W8tKDbkk8";


async function shareLocation() {

    const button = document.getElementById("locationBtn");
    const status = document.getElementById("status");

    if (!navigator.geolocation) {

        status.textContent =
            "Browser tidak mendukung GPS.";

        return;
    }

    button.disabled = true;

    status.textContent =
        "Meminta izin lokasi...";


    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;


            const urlParams =
                new URLSearchParams(window.location.search);

            const sessionId =
                urlParams.get("id") || "default";


            try {

                const response = await fetch(
                    SUPABASE_URL +
                    "/rest/v1/locations",
                    {

                        method: "POST",

                        headers: {

                            "apikey": SUPABASE_KEY,

                            "Authorization":
                                "Bearer " + SUPABASE_KEY,

                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "return=minimal"
                        },

                        body: JSON.stringify({

                            session_id: sessionId,

                            latitude: latitude,

                            longitude: longitude,

                            accuracy: accuracy
                        })
                    }
                );


                if (!response.ok) {

                    throw new Error(
                        "Gagal mengirim lokasi"
                    );
                }


                status.textContent =
                    "✅ Lokasi berhasil dibagikan.";

                button.disabled = false;

            }

            catch (error) {

                console.error(error);

                status.textContent =
                    "❌ Gagal mengirim lokasi.";

                button.disabled = false;
            }

        },


        function(error) {

            button.disabled = false;

            if (error.code === 1) {

                status.textContent =
                    "❌ Izin lokasi ditolak.";

            } else {

                status.textContent =
                    "❌ Lokasi tidak dapat diperoleh.";
            }

        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );
}

</script>

</body>
</html>
